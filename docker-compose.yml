services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports: ["5173:80"]
    depends_on: [backend]
